# Private relay addresses are examples: replace them with the real private IPs.
# Publish the frontend port only; firewall backends to allow this balancer only.
global
    maxconn 2048
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    timeout check 3s

frontend remotedesk_relay
    bind :8770
    default_backend relay_leader

backend relay_leader
    # Only the elected leader listens on 8770. Standby becomes healthy after promotion.
    option tcp-check
    default-server inter 2s fall 2 rise 2
    server relay1 10.20.0.11:8770 check send-proxy
    server relay2 10.20.0.12:8770 check send-proxy backup
