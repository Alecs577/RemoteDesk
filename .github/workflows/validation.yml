name: Validate RemoteDesk
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-build.lock
      - run: python -m compileall -q remotedesk scripts tests
      - run: python -m unittest discover -s tests -v
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: remotedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REMOTEDESK_TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/remotedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements/linux-relay.lock
      - run: python -m unittest tests.test_postgres tests.test_production tests.test_services_https -v
