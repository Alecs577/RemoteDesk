[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remotedesk"
version = "0.1.0"
description = "RemoteDesk remote access client and relay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow==13.0.0",
    "cryptography==50.0.2",
]

[project.gui-scripts]
remotedesk = "remotedesk.__main__:main"

[project.scripts]
remotedesk-relay = "remotedesk.relay:main"

[project.optional-dependencies]
build = ["PyInstaller==6.22.0"]
server = ["psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
include = ["remotedesk*"]
